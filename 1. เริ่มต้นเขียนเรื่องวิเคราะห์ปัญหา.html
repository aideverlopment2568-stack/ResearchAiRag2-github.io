<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2R Research Assistant - AI Pipeline</title>
    <style>
        :root {
            --bg-color: #f4f6f9;       /* พื้นหลังสีฟ้าอ่อนมาก (Light Grayish Blue) - คล้ายกับที่ระบุมาแต่ให้ความรู้สึกสะอาดกว่า */
            --card-bg: #ffffff;         /* สีขาวบริสุทธิ์ */
            --primary-color: #2c7bb6;  /* สีน้ำเงินฟ้ามาตรฐานการแพทย์/องค์กร (Medical Blue) */
            --text-color: #1d3557;     /* สีน้ำเงินเข้มเกือบดำ สำหรับตัวอักษร */
            --border-color: #cfe2ff;   /* สีฟ้าอ่อนจางๆ สำหรับเส้นขอบ */
            --hover-color: #1e5a96;    /* สีเมื่อเอาเมาส์วาง (Darker Blue) */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Angsana New';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        /* แผงควบคุมฝั่งซ้าย */
        .sidebar {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }
        .step-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #e6eef8;
            border: 1px solid #b6d1f4;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .step-btn:hover {
            background-color: #d2e4f9;
        }
        .step-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: bold;
        }
        .param-group {
            margin-top: 20px;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .param-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        /* พื้นที่ทำงานฝั่งขวา */
        .workspace {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        /* ส่วนแสดงผลลัพธ์ */
        .output-container {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-minor {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-minor:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<div class="container">
    
    <div class="sidebar">
        <h2>เล่าเรื่องจากหน้างาน มี 4 ขั้นตอน </h2>
        <button class="step-btn active" onclick="switchPhase(1)">1. การวิเคราะห์โครงสร้างปัญหา (House Model)</button>
        <button class="step-btn" onclick="switchPhase(2)">2. การวิเคราะห์สาเหตุเชิงลึก (Root Cause Analysis - RCA)</button>		
        <button class="step-btn" onclick="switchPhase(3)">3. การประเมินทางออกและช่องว่าง (SWOT & Gap Analysis)</button>
        <button class="step-btn" onclick="switchPhase(4)">4. การเรียบเรียงงานเขียนวิชาการ (Academic Synthesis)</button>

        <div class="param-group">
            <label for="modelName">Model (LM Studio):</label>
            <input type="text" id="modelName" value="gemma-4-e4b-it-qat" style="width:100%; padding:6px; box-sizing:border-box;">
            
            <label for="tempRange" style="margin-top:10px;">Temperature (ความเป๊ะ):</label>
            <input type="range" id="tempRange" min="0.1" max="1.0" step="0.1" value="0.3" style="width:100%;">
            <span id="tempVal">0.3</span>
        </div>
    </div>

    <div class="workspace">
        
        <div class="card">
            <h3>1. กล่องปรับแต่งรากฐานคำสั่ง (System Prompt)</h3>
            <textarea id="systemPromptBox" rows="8"></textarea>
        </div>

        <div class="card">
            <h3 id="phaseTitle">2. ข้อมูลดิบจากผู้ใช้ (User Input)</h3>
            <div class="alert-box" id="phaseNotice">
                คำแนะนำจะแสดงที่นี่ตามเฟสที่คุณเลือก
            </div>
            <textarea id="userInputBox" rows="6" placeholder="พิมพ์หรือวางข้อมูลดิบที่นี่..."></textarea>
            
            <button class="btn-send" onclick="submitToLocalAI()">ส่งให้ AI ประมวลผลแบบริ้ววิ่ง 🚀</button>

            <div class="output-container">
                <h3>3. ร่างเนื้อหาวิจัยที่ได้จาก AI (ผลลัพธ์)</h3>
                <div class="action-bar">
                    <button class="btn-minor" onclick="copyToClipboard()">คัดลอกข้อความ (Copy)</button>
                    <button class="btn-minor" style="background-color:#dc3545;" onclick="document.getElementById('outputBox').value=''">ล้างข้อมูล (Clear)</button>
                </div>
                <textarea id="outputBox" rows="15" placeholder="ผลลัพธ์จะค่อย ๆ วิ่งแสดงตรงนี้..."></textarea>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('tempRange').addEventListener('input', (e) => {
        document.getElementById('tempVal').innerText = e.target.value;
    });

const templates = {
  1: {
      title: "เฟส 1: การสกัดบริบทและวิเคราะห์โครงสร้างปัญหา (Context Mapping & House Model)",
      notice: "สกัดข้อมูล 5W1H/KPI และวิเคราะห์พิกัดรอยร้าวด้วย House Model (ตั้งค่า Temperature 0.1-0.2)",

    # Context

    # [1. Role & Persona]
    คุณคือ "วิศวกรระบบและผู้เชี่ยวชาญด้านการระบุปัญหา" (System Engineer & Problem Identification Expert) มีความสามารถในการอ่านจับใจความ สกัดข้อมูลบริบทอย่างแม่นยำ และจัดหมวดหมู่ความบกพร่องเชิงโครงสร้างได้อย่างเฉียบขาด

       - Foundation (รากฐาน): ข้อจำกัดด้านอุปกรณ์ เทคโนโลยี โครงสร้างพื้นฐาน หรือทรัพยากร
    4. **Format Output:** สรุปข้อมูลลงในโครงสร้างที่กำหนดอย่างสั้น กระชับ เป็นประเด็นชัดเจน (Markdown List)

    # [3. Constraints - กฎเหล็ก]
    - **No Fabrication:** ห้ามสร้างข้อเท็จจริงใหม่ที่ไม่มีใน Input เด็ดขาด หากหัวข้อใดไม่มีข้อมูลระบุในเรื่องเล่า ให้เขียนว่า "[ไม่ระบุในข้อมูลดิบ]"

    - **Conciseness:** เน้น Keyword และวลีที่เป็นรูปธรรม กระชับ ตรงประเด็น

    # [4. Output Formatting]

    ## ส่วนที่ 1: การสกัดบริบทแวดล้อม (Context Mapping)
    * **Who (ผู้เกี่ยวข้อง/กลุ่มเป้าหมาย):** [ระบุผู้รับบริการหรือผู้ปฏิบัติงาน]
    * **Where (สถานที่/หน่วยงาน):** [ระบุพื้นที่เกิดปัญหา]
    * **What (ภารกิจหลัก):** [ระบุสิ่งที่กำลังพยายามทำ]
    * **KPI / ข้อมูลสนับสนุน:** [ระบุตัวเลข สถิติ หรือสถานการณ์ความรุนแรงที่ปรากฏ]
	* **Time (ระยะเวลาเร่ิ่มทำวิจัย):** [ระบุระยะเวลาเริ่มต้น ถึงระยะเวลาสิ้นสุด]
	* **Process (ดำเนินการ):** [ระบุวิธีการทำสรุปรายละเอียดให้กระชับ]
	* ** The Event (เกิดอะไรขึ้น): ปัญหาหรือรอยร้าวที่พบ [ระบุ ค่าผิดพลาด, ล่าช้า, ข้อมูลไม่เชื่อมโยงกัน]
	* ** Policy   [ระบุ นโยบาย ระเบียบ พรบ.วิชาชีพที่เกี่ยวข้อง]
	* ** คู่มือ วิชาการ   [ระบุ เรื่องที่เกี่ยวข้อง]

    ## ส่วนที่ 2: โครงสร้างปัญหา (House Model Analysis)
    **1. Roof (หลังคา) - ผลกระทบต่อผู้รับบริการ:**
    * [ระบุผลกระทบข้อที่ 1]
    * [ระบุผลกระทบข้อที่ 2]

    **2. Pillars (เสาบ้าน) - ความบกพร่องของกระบวนการทำงาน:**
    * [ระบุความบกพร่องของกระบวนการข้อที่ 1]
    * [ระบุความบกพร่องของกระบวนการข้อที่ 2]

    **3. Foundation (รากฐาน) - ข้อจำกัดของโครงสร้างพื้นฐาน/อุปกรณ์:**
    * [ระบุข้อจำกัดข้อที่ 1]
    * [ระบุข้อจำกัดข้อที่ 2]

    **4. Core Symptom (สรุปอาการหลัก):**
    * [สรุปปัญหาหลักที่พบ 1 ประโยค เพื่อส่งต่อไปทำ RCA]
    `
	},
 2: {
      title: "เฟส 2: การวิเคราะห์สาเหตุเชิงลึก (Root Cause Analysis - RCA)",
      notice: "ใช้เทคนิค 5 Whys เจาะลึกจาก Core Symptom เพื่อหารากเหง้าเชิงระบบ (ตั้งค่า Temperature 0.1-0.2)",
      system: `
    # Context
    ผู้ใช้จะป้อนข้อมูลสะสมซึ่งประกอบด้วย 1) เรื่องเล่าหน้างานดิบ และ 2) ผลลัพธ์จากเฟส 1 (Context Mapping & House Model) เพื่อให้คุณทำหน้าที่วิเคราะห์หาสาเหตุรากฐานที่แท้จริง (Root Cause) ของปัญหาด้วยเทคนิค 5 Whys เพื่อใช้เป็นข้อมูลนำเข้าสำหรับเฟส 3 (SWOT) ต่อไป

    # [1. Role & Persona]
    คุณคือ "วิศวกรระบบและนักวิเคราะห์สาเหตุรากฐาน" (System Engineer & Root Cause Analyst) มีทักษะตรรกะศาสตร์ขั้นสูงในการเชื่อมโยงเหตุและผล สามารถมองทะลุอาการเปลือกนอก (Symptom) ลงไปถึงข้อจำกัดเชิงเทคนิค กระบวนการ หรือโครงสร้างพื้นฐานได้

    # [2. Core Instructions & Workflow]

       - คำตอบของ Why ข้อก่อนหน้า จะต้องกลายเป็นคำถามของ Why ข้อถัดไป

    # [3. Constraints - กฎเหล็ก]
    - **Logical Chain (ตรรกะลูกโซ่):** การถาม-ตอบ 5 Whys ต้องมีความเชื่อมโยงกันอย่างสมเหตุสมผลและอ้างอิงจากข้อมูลสะสมเท่านั้น ห้ามเดาหรือสร้างบริบทใหม่

    # [4. Output Formatting]

    ## การวิเคราะห์สาเหตุเชิงลึก (Root Cause Analysis: 5 Whys)

    **Problem Statement (ปัญหาตั้งต้น):** [ดึงข้อมูล Core Symptom จากเฟส 1 มาวางตรงนี้]

    * **Why 4:** ทำไม [คำตอบจาก Because 3] จึงเกิดขึ้น?

    **Root Cause (สรุปรากเหง้าของปัญหา):**
    * [สรุปสาเหตุรากฐานที่แท้จริง 1-2 ประโยค เพื่อนำไปใช้เป็นจุดตั้งต้นในการคิดค้นทางออก (SWOT) ในเฟสถัดไป]
    `

    async function submitToLocalAI() {
        const outputBox = document.getElementById('outputBox');

        const systemPrompt = document.getElementById('systemPromptBox').value;
        const userInput = document.getElementById('userInputBox').value;
        const modelName = document.getElementById('modelName').value;
        const temperature = parseFloat(document.getElementById('tempRange').value);

        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: modelName,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userInput }
                    ],
                    temperature: temperature,
                    stream: true 
                })
            });

            if (!response.ok) throw new Error("ไม่สามารถเชื่อมต่อ LM Studio ได้ กรุณาตรวจสอบว่าเปิดเซิร์ฟเวอร์หรือยัง");

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            outputBox.value = ""; 
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.slice(6).trim();
                        if (jsonStr === '[DONE]') continue;
                        
                        try {
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                fullText += content;
                                
                                let cleanText = fullText.replace(/<\|channel>thought[\s\S]*?<channel|>/g, '').trim();
                                cleanText = cleanText.replace(/<\|channel>thought[\s\S]*/g, '').trim();
                                
                                outputBox.value = cleanText;
                                outputBox.scrollTop = outputBox.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            }

        } catch (error) {
            outputBox.value = "เกิดข้อผิดพลาด: " + error.message + "\n\nคำแนะนำ:\n1. ตรวจสอบว่าเปิดโปรแกรม LM Studio และเปิด Local Server แล้วหรือยัง (Port 1234)\n2. ตรวจสอบว่าชื่อ Model ตรงกับตัวที่โหลดไว้ในเครื่องหรือไม่";
        }
    }
