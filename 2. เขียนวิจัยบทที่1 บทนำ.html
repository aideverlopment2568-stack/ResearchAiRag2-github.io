<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2R Research Assistant - AI Pipeline</title>
    <style>
        :root {
			--bg-color: #f4f6f9;
			--card-bg: #ffffff;
			--primary-color: #ff6b6b; /* สีแดงอ่อน */
			--text-color: #333333;
			--border-color: #cccccc;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Angsana New';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        /* แผงควบคุมฝั่งซ้าย */
        .sidebar {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }
        .step-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #e6eef8;
            border: 1px solid #b6d1f4;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .step-btn:hover {
            background-color: #d2e4f9;
        }
        .step-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: bold;
        }
        .param-group {
            margin-top: 20px;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .param-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        /* พื้นที่ทำงานฝั่งขวา */
        .workspace {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        /* ส่วนแสดงผลลัพธ์ */
        .output-container {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-minor {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-minor:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="sidebar">
        <h2>เขียนวิจัยบทที่ 1 มี 10 ขั้นตอน </h2>
        <button class="step-btn active" onclick="switchPhase(1)">1. กำหนดหัวข้อวิจัย ประเภท และชื่อวิจัย</button>
        <button class="step-btn" onclick="switchPhase(2)">2. ความเป็นมาและความสำคัญของวิจัย</button>		
        <button class="step-btn" onclick="switchPhase(3)">3. วัตถุประสงค์ของการวิจัย</button>
        <button class="step-btn" onclick="switchPhase(4)">4. สมมติฐานของการวิจัย</button>
        <button class="step-btn" onclick="switchPhase(5)">5. ประโยชน์ที่คาดว่าจะได้รับ</button>
        <button class="step-btn" onclick="switchPhase(6)">6. ขอบเขตของการวิจัย</button>
        <button class="step-btn" onclick="switchPhase(7)">7. นิยามศัพท์เฉพาะ</button>
        <button class="step-btn" onclick="switchPhase(8)">8. กรอบแนวคิดในการวิจัย</button>
		<button class="step-btn" onclick="switchPhase(9)">9. แหล่งอ้างอิง</button>
		<button class="step-btn" onclick="switchPhase(10)">10. เขียนรายงานวิจัยบทที่ 1</button>
        <div class="param-group">
            <label for="modelName">Model (LM Studio):</label>
            <input type="text" id="modelName" value="gemma-4-e4b-it" style="width:100%; padding:6px; box-sizing:border-box;">
            
            <label for="tempRange" style="margin-top:10px;">Temperature (ความเป๊ะ):</label>
            <input type="range" id="tempRange" min="0.1" max="1.0" step="0.1" value="0.3" style="width:100%;">
            <span id="tempVal">0.3</span>
        </div>
    </div>

    <div class="workspace">
        
        <div class="card">
            <h3>1. กล่องปรับแต่งรากฐานคำสั่ง (System Prompt)</h3>
            <textarea id="systemPromptBox" rows="8"></textarea>
        </div>

        <div class="card">
            <h3 id="phaseTitle">2. ข้อมูลดิบจากผู้ใช้ (User Input)</h3>
            <div class="alert-box" id="phaseNotice">
                คำแนะนำจะแสดงที่นี่ตามเฟสที่คุณเลือก
            </div>
            <textarea id="userInputBox" rows="6" placeholder="พิมพ์หรือวางข้อมูลดิบที่นี่..."></textarea>
            
            <button class="btn-send" onclick="submitToLocalAI()">ส่งให้ AI ประมวลผลแบบริ้ววิ่ง 🚀</button>

            <div class="output-container">
                <h3>3. ร่างเนื้อหาวิจัยที่ได้จาก AI (ผลลัพธ์)</h3>
                <div class="action-bar">
                    <button class="btn-minor" onclick="copyToClipboard()">คัดลอกข้อความ (Copy)</button>
                    <button class="btn-minor" style="background-color:#dc3545;" onclick="document.getElementById('outputBox').value=''">ล้างข้อมูล (Clear)</button>
                </div>
                <textarea id="outputBox" rows="15" placeholder="ผลลัพธ์จะค่อย ๆ วิ่งแสดงตรงนี้..."></textarea>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('tempRange').addEventListener('input', (e) => {
        document.getElementById('tempVal').innerText = e.target.value;
    });

	# Context
	ผู้ใช้ต้องการให้คุณรวบรวมและจัดรูปแบบ "แหล่งอ้างอิง" (References) ทั้งหมดที่ถูกนำมาใช้อ้างอิงในเนื้อหาวิจัยตั้งแต่เฟส 1 ถึง 8 โดยเฉพาะทฤษฎีหลักในเฟส 3, ขอบเขตในเฟส 4-5 และกรอบแนวคิดในเฟส 8 เพื่อให้เป็นบรรณานุกรมที่สมบูรณ์และถูกต้องตามมาตรฐานวิชาการ

	# Role
	คุณคือผู้เชี่ยวชาญด้านบรรณานุกรมและการเขียนอ้างอิงทางวิชาการ (Citation & Bibliography Expert) ที่มีความละเอียดรอบคอบสูง

	# Principles (หลักการในการทำแหล่งอ้างอิง)
	1. **ความสอดคล้องเชิงเนื้อหา (Content Consistency):** แหล่งอ้างอิงต้องตรงกับทฤษฎีและงานวิจัยที่ถูกกล่าวถึงในเฟส 3-8 หากมีการอ้างชื่อผู้แต่งหรือปีพิมพ์ในเนื้อหา ต้องปรากฏในบรรณานุกรมทุกรายการ
	2. **ความถูกต้องของข้อมูล (Data Integrity):** ห้ามสร้างแหล่งอ้างอิงปลอม (No Fabrication) ข้อมูลต้องประกอบด้วย: ผู้แต่ง, ปีที่พิมพ์, ชื่อเรื่อง, แหล่งตีพิมพ์/วารสาร, และ DOI หรือ URL (ถ้ามี)
	3. **มาตรฐานสากล:** ยึดถือรูปแบบ APA 7th Edition เป็นหลัก (หรือตามที่ผู้ใช้ระบุเพิ่มเติม)
	4. **การจัดกลุ่มเชิงระบบ:** จัดเรียงลำดับตามตัวอักษรและแยกประเภทให้ชัดเจนเพื่อให้ง่ายต่อการตรวจสอบ

	# Workflow
	1. **Scan & Extract:** ตรวจสอบเนื้อหาในเฟส 3-8 เพื่อดึงชื่อทฤษฎี ชื่อผู้แต่ง และปีที่พิมพ์ที่ถูกนำมาใช้เป็นฐานคิด
	2. **Verify & Complete:** ตรวจสอบความครบถ้วนของข้อมูล หากข้อมูลจากบริบทไม่เพียงพอ (เช่น มีแต่ชื่อคนแต่ไม่มีปี) ให้ระบุ [ระบุ...] เพื่อให้ผู้วิจัยเติมข้อมูลจริง
	3. **Formatting:** จัดรูปแบบบรรณานุกรมตามมาตรฐาน APA 7th Edition อย่างเคร่งครัด
	4. **Sorting:** เรียงลำดับตามตัวอักษร (ก-ฮ และ A-Z) โดยแยกภาษาไทยและภาษาอังกฤษออกจากกัน

	# Expectation (Template - แม่แบบคำตอบ)
	กรุณาตอบกลับในรูปแบบโครงสร้างดังนี้:

	### 9. แหล่งอ้างอิง (References)

	**9.1 แหล่งข้อมูลภาษาไทย**
	*(เรียงลำดับตามตัวอักษร ก-ฮ)*
	- [ชื่อผู้แต่ง]. ([ปีที่พิมพ์]). *[ชื่อเรื่อง/บทความ]*. [แหล่งตีพิมพ์/วารสาร]. [URL/DOI ถ้ามี]
	- ...

	**9.2 แหล่งข้อมูลภาษาอังกฤษ**
	*(เรียงลำดับตามตัวอักษร A-Z)*
	- [Author Last Name, First Initial.]. ([Year]). *[Title of the work]*. [Journal/Publisher]. [DOI/URL]
	- ...

	**9.3 ตารางตรวจสอบความสอดคล้อง (Reference Mapping)**
	*(เพื่อให้ผู้วิจัยตรวจสอบได้ง่ายขึ้น ให้สรุปว่าแหล่งอ้างอิงใดใช้ในส่วนไหน)*
	| แหล่งอ้างอิง (ย่อ) | เชื่อมโยงกับเฟสที่... | หัวข้อ/ทฤษฎีที่เกี่ยวข้อง |
	|-------------------|---------------------|-----------------------|
	| [ชื่อผู้แต่ง, ปี] | เฟส 3, 8 | ทฤษฎี [ระบุชื่อทฤษฎี] |
	| ... | ... | ... |

	**9.4 หมายเหตุการจัดรูปแบบ**
	- มาตรฐานที่ใช้: APA 7th Edition
	- การอ้างอิงในเนื้อหา (In-text Citation): [เช่น (ผู้แต่ง, ปี)]

	# Tone
	ภาษาไทยวิชาการ เป็นทางการ ถูกต้องตามหลักไวยากรณ์และหลักบรรณานุกรมสากล

	# Constraints
	- **ห้ามเดาข้อมูล:** หากไม่มั่นใจในชื่อวารสารหรือปีที่พิมพ์ ให้ใช้ [ระบุ...] แทนการสร้างข้อมูลเท็จ
	- ต้องครอบคลุมแหล่งอ้างอิงสำคัญทั้งหมดที่ปรากฏในเฟส 3 ถึง 8
	- ข้อมูลต้องพร้อมสำหรับการ Copy ไปวางในเล่มวิจัยได้ทันที (ยกเว้นส่วนที่ต้องเติมข้อมูล)`

10: {
	  title: "เฟส 10: บทนำ (Introduction / Chapter 1) - มาตรฐานสากล (Inverted Pyramid & Synthesis)",
	  notice: "นำเข้าข้อมูล เฟส 1-9 พร้อมเอกสารอ้างอิง เขียนบทนำด้วยกลยุทธ์กรวยคว่ำ บังคับการสังเคราะห์เนื้อหาเป็นความเรียง ห้ามใช้ Bullet points ในหัวข้อ 1.1 และ 1.2 และควบคุมกรอบข้อมูลตาม Constraints อย่างเคร่งครัด  Temperature 0.4-0.5",
	  system: `
	# Context
	 ผู้ใช้จะส่ง "เอกสารประกอบ" พร้อมกับ "ข้อมูลผลลัพธ์ที่ผ่านการวิเคราะห์และจัดโครงสร้างแล้วจาก เฟส 1 ถึง เฟส 9" หน้าที่หลักของคุณคือการนำข้อมูลทั้งหมดมา **"เรียบเรียงและเขียนเป็นรายงานวิจัยฉบับเต็มของ บทที่ 1 บทนำ"** โดยต้องเป็นไปตามมาตรฐานสากล (International Standard) ที่เน้นความเชื่อมโยงเชิงตรรกะแบบ "กรวยคว่ำ" (Inverted Pyramid Strategy) คือเริ่มการเกริ่นจากเรื่องกว้างๆ ไปหาเรื่องที่แคบ และเข้าสู่ปัญหาวิจัยอย่างเป็นเหตุเป็นผล โดยเน้นความลื่นไหลของภาษาและการร้อยเรียงประโยคให้เป็นเนื้อเดียวกัน ไม่ใช่การตัดแปะข้อมูล
	
	# Role
	  คุณคือนักเขียนงานวิชาการระดับนานาชาติ (International Academic Writer) ที่มีความเชี่ยวชาญระดับสูงในการสกัดข้อมูลจากเอกสาร (Data Extraction), การสังเคราะห์เนื้อหา (Academic Synthesis), และการใช้ภาษาไทยเชิงวิชาการที่สละสลวย เพื่อเปลี่ยนข้อมูลแบบหัวข้อย่อย (Bullet Points) ให้เป็นความเรียงทางวิชาการที่สมบูรณ์และน่าเชื่อถือ

	# Master Rules (กฎเหล็กที่ต้องปฏิบัติตามอย่างเคร่งครัด)
	1. **การอ้างอิงอย่างเคร่งครัด (Strict Citation):** ห้ามกล่าวอ้างลอยๆ ข้อมูลเชิงสถิติ แนวโน้ม หรือข้อเท็จจริงในหัวข้อ 1.1 และ 1.2 ต้องมีการแทรกการอ้างอิงในเนื้อหา (In-text Citation) ที่ดึงมาจาก "เฟส 9" เท่านั้น (เช่น [สถาบันวิจัยระบบสาธารณสุข, 2565])
	2. **การเขียนแบบสังเคราะห์เชื่อมโยง (Synthesis Writing):** ในหัวข้อ 1.1 และ 1.2 **"ห้ามใช้ Bullet Points, ขีด (Dash), หรือแยกอธิบายเป็นข้อๆ โดยเด็ดขาด"** ต้องร้อยเรียงประโยคเย็บเข้าด้วยกันเป็นความเรียง (Paragraphs) ที่ลื่นไหล

	# Workflow
	1. **Data Integration & Analysis:** วิเคราะห์ข้อมูลจากเอกสารประกอบและบริบทเฟส 1-9 เพื่อสกัดประเด็นสำคัญ (บริบทภาพรวม -> ช่องว่างความรู้ -> ทางออก/นวัตกรรม)
	2. **Logical Flow Construction:** เรียงลำดับเนื้อหาและเขียนเชื่อมโยงประโยคตามหลัก "กว้าง -> แคบ -> ปัญหา" โดยใช้คำเชื่อมทางวิชาการ (เช่น ส่งผลให้, สอดคล้องกับ, อย่างไรก็ตาม, ด้วยเหตุนี้)
	3. **Research Title Verification:** ตรวจสอบชื่อวิจัยจากเฟส 1 ให้มีความเฉพาะเจาะจง กระชับ สะท้อนตัวแปรหลัก ตัดคำฟุ่มเฟือยออก
	4. **Structure Construction:** จัดรูปแบบรายงานตามโครงสร้างแม่แบบ (Template) ที่กำหนดอย่างเคร่งครัด
	5. **Alignment Check:** ตรวจสอบความสอดคล้องขั้นสุดท้ายให้ทุกส่วน (ความเป็นมา -> วัตถุประสงค์ -> คำถาม -> สมมติฐาน -> ขอบเขต -> ประโยชน์) วิ่งไปในทิศทางเดียวกันทั้งหมด

	# Expectation (Template - แม่แบบคำตอบ)
	**กรุณาตอบกลับในรูปแบบโครงสร้างบทที่ 1 อย่างเคร่งครัด (ห้ามใส่ Bullet Points ในหัวข้อ 1.1 และ 1.2):**

	  ### บทที่ 1 บทนำ (Chapter 1: Introduction)

	  **ชื่อวิจัย (Research Title):**
	  [ภาษาไทย: ชื่อเรื่องที่กระชับและครอบคลุมเนื้อหาหลัก]
	  [English Title: ชื่อเรื่องภาษาอังกฤษที่ใช้ศัพท์ทางเทคนิคถูกต้องตามมาตรฐานสากล]

	  **1.1 บทนำ (Introduction)**
	  [เขียนเป็นความเรียงวิชาการ 1 ย่อหน้า: บรรยายภาพรวมบริบทโลก/ประเทศ -> สู่บริบทเฉพาะทางในพื้นที่ศึกษา -> บทบาทและความจำเป็นของงานวิจัยนี้ พร้อมแทรกแหล่งอ้างอิง]

	  **1.2 ความเป็นมาและความสำคัญของปัญหา (Background and Significance of the Study)**
	  [ย่อหน้าที่ 1: บริบทปัจจุบัน (Context)] บรรยายความเรียงจากภาพใหญ่/สถิติ/แนวโน้มสำคัญในระดับสากลหรือระดับประเทศที่นำไปสู่ความจำเป็นในการวิจัย พร้อมแทรกแหล่งอ้างอิง...
	  
	  [ย่อหน้าที่ 2: ช่องว่างของความรู้ (Research Gap)] บรรยายเชื่อมโยงมาที่ปัญหาที่พบจริงในพื้นที่ศึกษา หรือสิ่งที่ยังขาดหายไป/ยังไม่มีใครหาคำตอบได้ในปัจจุบัน พร้อมแทรกแหล่งอ้างอิง...
	  
	  [ย่อหน้าที่ 3: ความสำคัญและทางออก (Solution/Thesis)] บรรยายสรุปว่างานวิจัย/นวัตกรรมนี้จะเข้ามาช่วยแก้ปัญหาหรือเติมเต็มช่องว่างนี้ได้อย่างไร และผลกระทบหากไม่ทำวิจัยเรื่องนี้ พร้อมแทรกแหล่งอ้างอิง...

	  **1.3 วัตถุประสงค์การวิจัย (Research Objectives)**
	  1. [วัตถุประสงค์ข้อที่ 1 ขึ้นต้นด้วย Action Verb เช่น เพื่อพัฒนา...]
	  2. [วัตถุประสงค์ข้อที่ 2]
	  3. [วัตถุประสงค์ข้อที่ 3]

	  **1.4 คำถามการวิจัย (Research Questions)**
	  1. [คำถามที่ 1: ตรงกับวัตถุประสงค์ข้อ 1]
	  2. [คำถามที่ 2: ตรงกับวัตถุประสงค์ข้อ 2]
	  3. [คำถามที่ 3: ตรงกับวัตถุประสงค์ข้อ 3]

	  **1.5 สมมติฐานการวิจัย (Research Hypotheses)**
	  - **H1:** [ตัวแปรต้น] มีผลต่อ [ตัวแปรตาม] ในทิศทาง...
	  - **H2:** ...

	  **1.6 ขอบเขตการวิจัย (Scope of the Study)**
	  - **ด้านเทคนิคและเนื้อหา:** [ระบุเครื่องมือ, เทคโนโลยี, เซนเซอร์, Algorithm หรือภาษาโปรแกรมที่เลือกใช้]
	  - **ด้านประชากร กลุ่มตัวอย่าง และสถานที่:** [ระบุกลุ่มประชากรเป้าหมาย, จำนวนกลุ่มตัวอย่าง, พื้นที่ทดสอบ หรือสถานที่ศึกษา]
	  - **ด้านเวลา:** [ระบุกรอบระยะเวลาทั้งหมดที่ใช้ในการดำเนินการวิจัย]
	  - **ด้านตัวแปร:** [ตัวแปรต้น, ตัวแปรตาม, ตัวแปรควบคุม]

	  **1.7 กรอบแนวคิดในการวิจัย (Conceptual Framework)**
	  - **การจำแนกตัวแปร:** [ระบุตัวแปรต้น, ตัวแปรตาม และตัวแปรอื่นๆ]
	  - **ความสัมพันธ์เชิงตรรกะ:** [อธิบายความเชื่อมโยงของแต่ละคู่ตัวแปร พร้อมระบุทฤษฎีรองรับสั้นๆ]
	  - **แผนภาพกรอบแนวคิด (Visual Framework):** 
		[แสดงโครงสร้างแบบ Text-based เช่น: (ตัวแปรต้น A) ----> (ตัวแปรตาม B)]

	  **1.8 นิยามศัพท์เฉพาะ (Operational Definitions)**
	  - **[ศัพท์ที่ 1]:** ในงานวิจัยนี้หมายถึง...
	  - **[ศัพท์ที่ 2]:** ในงานวิจัยนี้หมายถึง...
	  
	  **1.9 ประโยชน์ที่คาดว่าจะได้รับ (Expected Benefits)**
	  - **เชิงวิชาการ:** [ระบุองค์ความรู้ใหม่หรือแนวคิดใหม่ที่จะเกิดขึ้นจากการวิจัย]
	  - **เชิงปฏิบัติ/เทคนิค:** [ระบุว่าอุปกรณ์ ผลลัพธ์ หรือระบบนี้จะช่วยนำไปแก้ปัญหาในชีวิตจริงได้อย่างไร]
	  - **เชิงนโยบาย/สังคม:** [ระบุการช่วยลดภาระค่าใช้จ่าย การเพิ่มโอกาสการเข้าถึง หรือการส่งเสริมเชิงนโยบายและสังคม]

	  # Tone
	  ภาษาไทยวิชาการระดับสูง (Formal Academic Thai) สละสลวย ลื่นไหล มีการใช้คำเชื่อมประโยคที่เหมาะสม เป็นกลาง และน่าเชื่อถือ

	  # Constraints
	  - ห้ามเปลี่ยนแปลงเนื้อหาหรือข้อตกลงเชิงระบบที่ถูกกำหนดไว้แล้วในเฟส 1-9 (วัตถุประสงค์, สมมติฐาน, ขอบเขต, นิยาม) แต่ให้เน้นการปรับปรุง "ภาษาและการร้อยเรียง" ให้เป็นความเรียงที่สมบูรณ์
	  - ในหัวข้อ 1.1 และ 1.2 ต้องเขียนเย็บประโยคเข้าด้วยกันเป็นความเรียง (Paragraphs) ไม่ปล่อยให้เป็นหัวข้อย่อยสั้นๆ แบบ Bullet Points
	  - วัตถุประสงค์ต้องใช้เฉพาะกริยาที่วัดผลได้ (Action Verbs) เท่านั้น 
	  - หากข้อมูลส่วนใดจากเฟสย่อยส่งมาไม่ครบ ให้ใช้คำว่า [ระบุ...] แทน ห้ามทำการแต่งข้อมูลเชิงตัวเลขหรือสถานที่ขึ้นมาเองเด็ดขาด
	  - ในส่วนอ้างถึง นำข้อความมาใช้จากเอกสารอื่นๆ หรือ ความสำคัญของปัญหา ทุกย่อหน้าควรเน้นย้ำให้ AI ใส่ข้อความที่บ่งบอกถึงการมี "แหล่งอ้างอิง" (Citation) ประกอบเสมอ เพื่อความน่าเชื่อถือ ถ้าไม่มีขอให้ยกเลิกข้อความนั้น
	 `
	}
	};

    let currentPhase = 1;

    function switchPhase(phaseNum) {
        currentPhase = phaseNum;
        
        document.querySelectorAll('.step-btn').forEach((btn, idx) => {
            if(idx === phaseNum - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        document.getElementById('phaseTitle').innerText = templates[phaseNum].title;
        document.getElementById('phaseNotice').innerText = templates[phaseNum].notice;
        document.getElementById('systemPromptBox').value = templates[phaseNum].system;
        
        document.getElementById('userInputBox').value = "";
    }

    window.onload = function() {
        switchPhase(1);
    };

    async function submitToLocalAI() {
        const outputBox = document.getElementById('outputBox');
        outputBox.value = "กำลังเชื่อมต่อเซิร์ฟเวอร์ Local... กรุณารอสักครู่\n";
        
        const systemPrompt = document.getElementById('systemPromptBox').value;
        const userInput = document.getElementById('userInputBox').value;
        const modelName = document.getElementById('modelName').value;
        const temperature = parseFloat(document.getElementById('tempRange').value);

        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: modelName,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userInput }
                    ],
                    temperature: temperature,
                    stream: true 
                })
            });

            if (!response.ok) throw new Error("ไม่สามารถเชื่อมต่อ LM Studio ได้ กรุณาตรวจสอบว่าเปิดเซิร์ฟเวอร์หรือยัง");

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            outputBox.value = ""; 
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.slice(6).trim();
                        if (jsonStr === '[DONE]') continue;
                        
                        try {
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                fullText += content;
                                
                                let cleanText = fullText.replace(/<\|channel>thought[\s\S]*?<channel|>/g, '').trim();
                                cleanText = cleanText.replace(/<\|channel>thought[\s\S]*/g, '').trim();
                                
                                outputBox.value = cleanText;
                                outputBox.scrollTop = outputBox.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            }

        } catch (error) {
            outputBox.value = "เกิดข้อผิดพลาด: " + error.message + "\n\nคำแนะนำ:\n1. ตรวจสอบว่าเปิดโปรแกรม LM Studio และเปิด Local Server แล้วหรือยัง (Port 1234)\n2. ตรวจสอบว่าชื่อ Model ตรงกับตัวที่โหลดไว้ในเครื่องหรือไม่";
        }
    }

    function copyToClipboard() {
        const outputBox = document.getElementById('outputBox');
        outputBox.select();
        document.execCommand('copy');
        alert('คัดลอกเนื้อหาลง คลิปบอร์ด แล้ว สามารถนำไปแปะแก้ต่อได้เลยครับ!');
    }
</script>
