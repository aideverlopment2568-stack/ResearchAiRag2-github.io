<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2R Research Assistant - AI Pipeline</title>
    <style>
        :root {
            --bg-color: #f9f5ee;       /* พื้นหลังสีครีม/ส้มอ่อนมาก (Warm Off-White) - อ่อนโยนกว่าฟ้าเดิม */
            --card-bg: #ffffff;         /* สีขาวบริสุทธิ์ */
            --primary-color: #e67e22;  /* สีส้มอิฐ (Carrot Orange) - โทนสีหลักที่ดูเป็นมืออาชีพ */
            --text-color: #4a3b31;     /* สีน้ำตาลเข้มเกือบดำ เพื่อให้อ่านง่ายและเข้ากับโทนส้ม */
            --border-color: #f0d2b8;   /* สีส้มอ่อนจางๆ สำหรับเส้นขอบ */
            --hover-color: #c4571e;    /* สีเมื่อเอาเมาส์วาง (เข้มกว่า primary) */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Angsana New';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        /* แผงควบคุมฝั่งซ้าย */
        .sidebar {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }
        .step-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #e6eef8;
            border: 1px solid #b6d1f4;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .step-btn:hover {
            background-color: #d2e4f9;
        }
        .step-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: bold;
        }
        .param-group {
            margin-top: 20px;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .param-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        /* พื้นที่ทำงานฝั่งขวา */
        .workspace {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        /* ส่วนแสดงผลลัพธ์ */
        .output-container {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-minor {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-minor:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="sidebar">
        <h2>เขียนโครงร่างวิจัยด้วย AI (บทที่ 1 ถึง 3)</h2>
        <button class="step-btn active" onclick="switchPhase(1)">1. เรียบเรียงโครงร่างงานวิจัย</button>
        <button class="step-btn" onclick="switchPhase(2)">2. วิเคราะห์การประเมินแบบร่างงานวิจัย</button>
        <button class="step-btn" onclick="switchPhase(3)">3. เรียบเรียงโครงร่างวิจัยจากการประเมิน</button>      
        <div class="param-group">
            <label for="modelName">Model (LM Studio):</label>
            <input type="text" id="modelName" value="gemma-4-e4b-it-qat" style="width:100%; padding:6px; box-sizing:border-box;">
            
            <label for="tempRange" style="margin-top:10px;">Temperature (ความเป๊ะ):</label>
            <input type="range" id="tempRange" min="0.1" max="1.0" step="0.1" value="0.3" style="width:100%;">
            <span id="tempVal">0.3</span>
        </div>
    </div>

    <div class="workspace">
        
        <div class="card">
            <h3>1. กล่องปรับแต่งรากฐานคำสั่ง (System Prompt)</h3>
            <textarea id="systemPromptBox" rows="8"></textarea>
        </div>

        <div class="card">
            <h3 id="phaseTitle">2. ข้อมูลดิบจากผู้ใช้ (User Input)</h3>
            <div class="alert-box" id="phaseNotice">
                คำแนะนำจะแสดงที่นี่ตามเฟสที่คุณเลือก
            </div>
            <textarea id="userInputBox" rows="6" placeholder="พิมพ์หรือวางข้อมูลดิบที่นี่..."></textarea>
            
            <button class="btn-send" onclick="submitToLocalAI()">ส่งให้ AI ประมวลผลแบบริ้ววิ่ง 🚀</button>

            <div class="output-container">
                <h3>3. ร่างเนื้อหาวิจัยที่ได้จาก AI (ผลลัพธ์)</h3>
                <div class="action-bar">
                    <button class="btn-minor" onclick="copyToClipboard()">คัดลอกข้อความ (Copy)</button>
                    <button class="btn-minor" style="background-color:#dc3545;" onclick="document.getElementById('outputBox').value=''">ล้างข้อมูล (Clear)</button>
                </div>
                <textarea id="outputBox" rows="15" placeholder="ผลลัพธ์จะค่อย ๆ วิ่งแสดงตรงนี้..."></textarea>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('tempRange').addEventListener('input', (e) => {
        document.getElementById('tempVal').innerText = e.target.value;
    });

2: {

    function switchPhase(phaseNum) {
        currentPhase = phaseNum;
        
        document.querySelectorAll('.step-btn').forEach((btn, idx) => {
            if(idx === phaseNum - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        document.getElementById('phaseTitle').innerText = templates[phaseNum].title;
        document.getElementById('phaseNotice').innerText = templates[phaseNum].notice;
        document.getElementById('systemPromptBox').value = templates[phaseNum].system;
        
        document.getElementById('userInputBox').value = "";
    }

    async function submitToLocalAI() {
        const outputBox = document.getElementById('outputBox');
        outputBox.value = "กำลังเชื่อมต่อเซิร์ฟเวอร์ Local... กรุณารอสักครู่\n";
        
        const systemPrompt = document.getElementById('systemPromptBox').value;
        const userInput = document.getElementById('userInputBox').value;
        const modelName = document.getElementById('modelName').value;
        const temperature = parseFloat(document.getElementById('tempRange').value);

        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: modelName,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userInput }
                    ],
                    temperature: temperature,
                    stream: true 
                })
            });

            if (!response.ok) throw new Error("ไม่สามารถเชื่อมต่อ LM Studio ได้ กรุณาตรวจสอบว่าเปิดเซิร์ฟเวอร์หรือยัง");

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            outputBox.value = ""; 
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.slice(6).trim();
                        if (jsonStr === '[DONE]') continue;
                        
                        try {
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                fullText += content;
                                
                                let cleanText = fullText.replace(/<\|channel>thought[\s\S]*?<channel|>/g, '').trim();
                                cleanText = cleanText.replace(/<\|channel>thought[\s\S]*/g, '').trim();
                                
                                outputBox.value = cleanText;
                                outputBox.scrollTop = outputBox.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            }

        } catch (error) {
            outputBox.value = "เกิดข้อผิดพลาด: " + error.message + "\n\nคำแนะนำ:\n1. ตรวจสอบว่าเปิดโปรแกรม LM Studio และเปิด Local Server แล้วหรือยัง (Port 1234)\n2. ตรวจสอบว่าชื่อ Model ตรงกับตัวที่โหลดไว้ในเครื่องหรือไม่";
        }
    }

    function copyToClipboard() {
        const outputBox = document.getElementById('outputBox');
        outputBox.select();
        document.execCommand('copy');
