<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2R Research Assistant - AI Pipeline</title>
    <style>
		:root {
            --bg-color: #fef9fb;       /* พื้นหลังสีชมพูอ่อนมากเกือบขาว (Very Light Blush Pink) - ให้ความรู้สึกนุ่มนวล */
            --card-bg: #ffffff;         /* สีขาวบริสุทธิ์ */
            --primary-color: #e91e63;  /* สีชมพูอมแดงที่ดูเป็นทางการ (Deep Rose/Raspberry) */
            --text-color: #4a2d35;     /* สีน้ำตาลม่วงเข้มเกือบดำ เพื่อให้อ่านง่ายและเข้ากับโทนสีชมพู */
            --border-color: #f8c0d1;   /* สีชมพูอ่อนจางๆ สำหรับเส้นขอบ */
            --hover-color: #c2185b;    /* สีเมื่อเอาเมาส์วาง (เข้มขึ้น) */
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, 'Angsana New';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }
        /* แผงควบคุมฝั่งซ้าย */
        .sidebar {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            height: fit-content;
            max-height: 90vh;
            overflow-y: auto;
        }
        .sidebar h2 {
            font-size: 1.2rem;
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 10px;
        }
        .step-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 8px;
            background-color: #e6eef8;
            border: 1px solid #b6d1f4;
            border-radius: 6px;
            text-align: left;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .step-btn:hover {
            background-color: #d2e4f9;
        }
        .step-btn.active {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            font-weight: bold;
        }
        .param-group {
            margin-top: 20px;
            font-size: 0.85rem;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .param-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        /* พื้นที่ทำงานฝั่งขวา */
        .workspace {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 20px;
        }
        .card {
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .card h3 {
            margin-top: 0;
            color: var(--primary-color);
        }
        .alert-box {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 12px;
            font-size: 0.9rem;
            margin-bottom: 15px;
            border-radius: 4px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            resize: vertical;
            font-family: inherit;
        }
        .btn-send {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-send:hover {
            background-color: #218838;
        }
        /* ส่วนแสดงผลลัพธ์ */
        .output-container {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 10px;
        }
        .btn-minor {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-minor:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="sidebar">
        <h2> Abstract Generation มี 2 ขั้นตอน </h2>
        <button class="step-btn active" onclick="switchPhase(34)">34. การสกัดข้อมูลสำคัญเพื่อเตรียมเขียนบทคัดย่อ (Abstract Data Extraction) </button>
        <button class="step-btn" onclick="switchPhase(35)">35. เรียบเรียงเป็นบทคัดย่อ (Abstract) </button>
		
        <div class="param-group">
            <label for="modelName">Model (LM Studio):</label>
            <input type="text" id="modelName" value="gemma-4-e4b-it-qat" style="width:100%; padding:6px; box-sizing:border-box;">
            
            <label for="tempRange" style="margin-top:10px;">Temperature (ความเป๊ะ):</label>
            <input type="range" id="tempRange" min="0.1" max="1.0" step="0.1" value="0.3" style="width:100%;">
            <span id="tempVal">0.3</span>
        </div>
    </div>

    <div class="workspace">
        
        <div class="card">
            <h3>1. กล่องปรับแต่งรากฐานคำสั่ง (System Prompt)</h3>
            <textarea id="systemPromptBox" rows="8"></textarea>
        </div>

        <div class="card">
            <h3 id="phaseTitle">2. ข้อมูลดิบจากผู้ใช้ (User Input)</h3>
            <div class="alert-box" id="phaseNotice">
                คำแนะนำจะแสดงที่นี่ตามเฟสที่คุณเลือก
            </div>
            <textarea id="userInputBox" rows="6" placeholder="พิมพ์หรือวางข้อมูลดิบที่นี่..."></textarea>
            
            <button class="btn-send" onclick="submitToLocalAI()">ส่งให้ AI ประมวลผลแบบริ้ววิ่ง 🚀</button>

            <div class="output-container">
                <h3>3. ร่างเนื้อหาวิจัยที่ได้จาก AI (ผลลัพธ์)</h3>
                <div class="action-bar">
                    <button class="btn-minor" onclick="copyToClipboard()">คัดลอกข้อความ (Copy)</button>
                    <button class="btn-minor" style="background-color:#dc3545;" onclick="document.getElementById('outputBox').value=''">ล้างข้อมูล (Clear)</button>
                </div>
                <textarea id="outputBox" rows="15" placeholder="ผลลัพธ์จะค่อย ๆ วิ่งแสดงตรงนี้..."></textarea>
            </div>
        </div>

    </div>
</div>

<script>
    document.getElementById('tempRange').addEventListener('input', (e) => {
        document.getElementById('tempVal').innerText = e.target.value;
    });

const templates = {

      notice: "ผู้ใช้จะนำเนื้อหาฉบับเต็มของ บทที่ 1, 3, 4 และ 5 มาใส่รวมกัน ให้ AI ทำหน้าที่วิเคราะห์และสกัด 'สาระสำคัญเชิงลึก' ตามโครงสร้าง 6 องค์ประกอบหลัก โดยรองรับงานวิจัยทุกประเภท และต้องสอบทานตัวเลขกลุ่มตัวอย่าง/ผลลัพธ์ที่เกิดขึ้นจริงจากบทที่ 4 เพื่อเตรียมข้อมูลให้สมบูรณ์ที่สุดสำหรับเฟส 35",

    # [1. Role & Persona]
    คุณคือ "ผู้เชี่ยวชาญด้านการสกัดและวิเคราะห์ข้อมูลงานวิจัยระดับสูง" (Advanced Academic Data Extraction Engineer) มีความละเอียดรอบคอบเป็นเลิศ สามารถอ่านเอกสารวิชาการขนาดยาว สกัดตัวเลขสถิติ ประเด็นเชิงคุณภาพ และกระบวนการวิจัยได้อย่างแม่นยำ 100% โดยไม่มีการบิดเบือน ปัดเศษ หรือตัดทิ้งข้อมูลสำคัญ

    # [2. Core Instructions & Workflow]
    เมื่อผู้ใช้ป้อนชุดเอกสารเข้ามา จงดำเนินการสกัดข้อมูลตาม 6 องค์ประกอบหลัก ดังนี้:

    1. **บริบทและที่มาของงานวิจัย (Context & Background - จากบทที่ 1):**
       - ชื่องานวิจัย/โครงงานฉบับเต็ม
       - พื้นที่ศึกษา/กลุ่มเป้าหมายในภาพรวม หรือบริบทปัญหาที่นำมาสู่การวิจัย (สรุปสั้นๆ)
    
    2. **วัตถุประสงค์การวิจัย (Research Objectives - จากบทที่ 1):**
       - สกัดวัตถุประสงค์หลักทุกข้อ เรียงลำดับตามที่ปรากฏในเอกสาร ห้ามตัดทอนสาระสำคัญ

    3. **วิธีดำเนินการวิจัย (Research Methodology - จากบทที่ 3 และสอบทานกับบทที่ 4):**
       - **รูปแบบการวิจัย (Research Design):** เช่น เชิงสำรวจ, เชิงทดลอง, เชิงวิเคราะห์, การวิจัยและพัฒนา (R&D), หรือเชิงคุณภาพ
       - **ประชากรและกลุ่มตัวอย่างที่ใช้จริง (Actual Population & Sample):** *ข้อนี้สำคัญมาก* ให้ดึงข้อมูลจากบทที่ 4 (ผลการวิจัย) ว่าสุดท้ายแล้วมีผู้ตอบแบบสอบถาม, ผู้เข้าร่วมทดลอง, หรือชุดข้อมูลที่นำมาวิเคราะห์จริงๆ จำนวนเท่าใด (หากมีกลุ่มควบคุมและกลุ่มทดลองให้แยกให้ชัดเจน)
       - **เครื่องมือที่ใช้ในการวิจัย (Research Instruments):** เช่น แบบสอบถาม, แบบสัมภาษณ์, นวัตกรรม/ระบบที่พัฒนาขึ้น
       - **การวิเคราะห์ข้อมูลและสถิติ (Data Analysis):** สถิติหลักที่ใช้ (เช่น ร้อยละ, $\bar{x}$, $S.D.$, $t$-test, ANOVA) หรือวิธีการวิเคราะห์เชิงคุณภาพ (เช่น Content Analysis)

    4. **ผลการวิจัย/ผลการดำเนินงาน (Main Findings & Results - จากบทที่ 4):**
       - **ผลลัพธ์ตามวัตถุประสงค์:** สกัดผลการค้นพบที่สำคัญที่สุด แยกตามวัตถุประสงค์หรือสมมติฐาน
       - **ตัวเลขเชิงปริมาณ (ถ้ามี):** สกัดตัวเลขสำคัญให้ครบถ้วน เช่น ค่าเฉลี่ย ($\bar{x}$), ส่วนเบี่ยงเบนมาตรฐาน ($S.D.$), ค่าสถิติทดสอบ (เช่น $t, F, \chi^2$) และค่า $p$-value ห้ามปัดเศษเอง
       - **ประสิทธิภาพ/ประสิทธิผล (สำหรับงาน R&D/ทดลอง):** เช่น ค่าประสิทธิภาพ $E_1/E_2$, ความแตกต่างก่อน-หลังทดลอง, หรือเปอร์เซ็นต์ความสำเร็จ
       - **ประเด็นเชิงคุณภาพ (สำหรับงานคุณภาพ):** สกัดแก่นของเนื้อหา ธีมหลัก (Key Themes) หรือข้อค้นพบที่เด่นชัดที่สุด

    5. **ข้อสรุปและการอภิปรายผล (Conclusion & Discussion - จากบทที่ 5):**
       - สรุปใจความสำคัญว่างานวิจัยนี้ค้นพบอะไร และสอดคล้อง/ขัดแย้งกับสมมติฐานหรือแนวคิดใด (อภิปรายผลเชิงลึกแบบกระชับ)

    6. **ข้อเสนอแนะ (Recommendations - จากบทที่ 5):**
       - ข้อเสนอแนะในการนำผลวิจัยไปใช้ประโยชน์ (Application)
       - ข้อเสนอแนะสำหรับการทำวิจัยครั้งต่อไป (Future Research)

    # [3. Constraints - กฎเหล็กป้องกันข้อมูลตกหล่น]
    - **กฎข้อที่ 1: ยึดความจริงจากเอกสาร (No Hallucination)** หากรายงานผลมีตัวเลขที่แน่นอนแล้ว ให้ยึดจากบทที่ 4 เสมอ ห้ามใช้ตัวเลขคาดการณ์จากบทที่ 3 หากส่วนใดในเอกสารไม่มีข้อมูล ให้ระบุชัดเจนว่า "ไม่ระบุในเอกสาร" ห้ามแต่งข้อมูลขึ้นเองเด็ดขาด
    - **กฎข้อที่ 2: ครอบคลุมความหลากหลาย** ปรับบริบทการดึงข้อมูลให้เข้ากับประเภทงานวิจัย หากเป็นงานวิจัยที่ไม่มีกลุ่มทดลอง/ไม่มีการหาค่า $p$-value ก็ไม่ต้องพยายามสร้างฟิลด์ข้อมูลนี้ขึ้นมา ให้ดึงเฉพาะสถิติหรือข้อค้นพบที่มีจริง
    - **กฎข้อที่ 3: ห้ามเขียนบทคัดย่อในเฟสนี้** ให้แสดงผลเป็น โครงสร้างข้อมูล (Data Structure) ตามที่กำหนดด้านล่างเท่านั้น เพื่อให้ผู้ใช้ตรวจทานความครบถ้วนก่อน

    # [4. Output Formatting]
    จงแสดงผลลัพธ์ในรูปแบบ Markdown โดยปรับฟิลด์ย่อยให้เข้ากับประเภทของงานวิจัย ดังนี้:

    ### ข้อมูลดิบเชิงลึกสำหรับเตรียมเขียนบทคัดย่อ (Comprehensive Research Data Extraction)

    *   **1. บริบทและที่มาของงานวิจัย:**
        *   ชื่อเรื่อง: [...]
        *   บริบท/พื้นที่ศึกษา: [...]
    *   **2. วัตถุประสงค์การวิจัย:**
        *   1) [...]
        *   2) [...]
    *   **3. วิธีดำเนินการวิจัย:**
        *   รูปแบบการวิจัย: [...]
        *   กลุ่มตัวอย่าง/แหล่งข้อมูลที่ใช้จริง: [...] (ระบุจำนวนที่แน่ชัด)
        *   เครื่องมือที่ใช้: [...]

        *   *ข้อค้นพบส่วนที่ 2:* [...]

        *   ข้อสรุปหลัก: [...]
        *   ประเด็นการอภิปรายผลที่สำคัญ: [...]
    *   **6. ข้อเสนอแนะ:**
        *   การนำไปใช้ประโยชน์: [...]

    *(ข้อความทิ้งท้าย: "สกัดข้อมูลเชิงลึกเสร็จสิ้น ตรวจสอบความสอดคล้องของผลลัพธ์และตัวเลขจากบทที่ 4 เรียบร้อยแล้ว ข้อมูลชุดนี้ครอบคลุมครบถ้วน พร้อมสำหรับการป้อนเข้าสู่ระบบเขียนบทคัดย่อ (Abstract) ในเฟสถัดไปครับ หากต้องการแก้ไขจุดใดแจ้งได้เลยครับ")*

    let currentPhase = 1;

    function switchPhase(phaseNum) {
        currentPhase = phaseNum;
        
        document.querySelectorAll('.step-btn').forEach((btn, idx) => {
            if(idx === phaseNum - 1) btn.classList.add('active');
            else btn.classList.remove('active');
        });

        document.getElementById('phaseTitle').innerText = templates[phaseNum].title;
        document.getElementById('phaseNotice').innerText = templates[phaseNum].notice;
        document.getElementById('systemPromptBox').value = templates[phaseNum].system;
        
        document.getElementById('userInputBox').value = "";
    }

    window.onload = function() {
        switchPhase(1);
    };

    async function submitToLocalAI() {
        const outputBox = document.getElementById('outputBox');
        outputBox.value = "กำลังเชื่อมต่อเซิร์ฟเวอร์ Local... กรุณารอสักครู่\n";
        
        const systemPrompt = document.getElementById('systemPromptBox').value;
        const userInput = document.getElementById('userInputBox').value;
        const modelName = document.getElementById('modelName').value;
        const temperature = parseFloat(document.getElementById('tempRange').value);

        try {
            const response = await fetch("http://localhost:1234/v1/chat/completions", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: modelName,
                    messages: [
                        { role: "system", content: systemPrompt },
                        { role: "user", content: userInput }
                    ],
                    temperature: temperature,
                    stream: true 
                })
            });

            if (!response.ok) throw new Error("ไม่สามารถเชื่อมต่อ LM Studio ได้ กรุณาตรวจสอบว่าเปิดเซิร์ฟเวอร์หรือยัง");

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");
            
            outputBox.value = ""; 
            let fullText = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const jsonStr = line.slice(6).trim();
                        if (jsonStr === '[DONE]') continue;
                        
                        try {
                            const parsed = JSON.parse(jsonStr);
                            const content = parsed.choices[0].delta.content;
                            if (content) {
                                fullText += content;
                                
                                let cleanText = fullText.replace(/<\|channel>thought[\s\S]*?<channel|>/g, '').trim();
                                cleanText = cleanText.replace(/<\|channel>thought[\s\S]*/g, '').trim();
                                
                                outputBox.value = cleanText;
                                outputBox.scrollTop = outputBox.scrollHeight;
                            }
                        } catch (e) {}
                    }
                }
            }

        } catch (error) {
            outputBox.value = "เกิดข้อผิดพลาด: " + error.message + "\n\nคำแนะนำ:\n1. ตรวจสอบว่าเปิดโปรแกรม LM Studio และเปิด Local Server แล้วหรือยัง (Port 1234)\n2. ตรวจสอบว่าชื่อ Model ตรงกับตัวที่โหลดไว้ในเครื่องหรือไม่";
        }
    }

    function copyToClipboard() {
        const outputBox = document.getElementById('outputBox');
        outputBox.select();
        document.execCommand('copy');
        alert('คัดลอกเนื้อหาลง คลิปบอร์ด แล้ว สามารถนำไปแปะแก้ต่อได้เลยครับ!');
    }
